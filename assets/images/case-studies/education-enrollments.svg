<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 869 470" width="869" height="470" style="background:#070216; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="eduBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1e0c42" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0e0422" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04010d" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="eduGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="capGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="eduLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="eduCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190a35" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090216" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="eduArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowEdu" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowEdu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="869" height="470" fill="url(#eduBg)"/>
  <circle cx="560" cy="220" r="260" fill="url(#eduGlow)"/>

  <!-- Student Admission Network Graph (Synaptic Connections) -->
  <g opacity="0.65">
    <!-- Connecting Laser Lines -->
    <path d="M 460,120 L 550,180 L 670,130 L 780,190" fill="none" stroke="url(#eduLine)" stroke-width="2" filter="url(#glowEdu)"/>
    <path d="M 550,180 L 610,280 L 730,300" fill="none" stroke="url(#eduLine)" stroke-width="2" filter="url(#glowEdu)"/>
    <path d="M 460,120 L 490,260 L 610,280" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4"/>
    <path d="M 670,130 L 730,300" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="6,4"/>

    <!-- Student Avatar Nodes -->
    <!-- Node 1: (460, 120) -->
    <g transform="translate(460, 120)">
      <circle cx="0" cy="0" r="14" fill="#190a35" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="0" cy="-3" r="4" fill="#3b82f6"/>
      <path d="M -7,8 C -7,3 7,3 7,8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    </g>

    <!-- Node 2: (550, 180) -->
    <g transform="translate(550, 180)">
      <circle cx="0" cy="0" r="16" fill="#190a35" stroke="#06b6d4" stroke-width="2" filter="url(#glowEdu)"/>
      <circle cx="0" cy="-3" r="5" fill="#06b6d4"/>
      <path d="M -8,9 C -8,4 8,4 8,9" fill="none" stroke="#06b6d4" stroke-width="1.8"/>
    </g>

    <!-- Node 3: (670, 130) -->
    <g transform="translate(670, 130)">
      <circle cx="0" cy="0" r="15" fill="#190a35" stroke="#10b981" stroke-width="2"/>
      <circle cx="0" cy="-3" r="4" fill="#10b981"/>
      <path d="M -7,8 C -7,3 7,3 7,8" fill="none" stroke="#10b981" stroke-width="1.5"/>
    </g>

    <!-- Node 4: (780, 190) -->
    <g transform="translate(780, 190)">
      <circle cx="0" cy="0" r="14" fill="#190a35" stroke="#a855f7" stroke-width="2"/>
      <circle cx="0" cy="-3" r="4" fill="#a855f7"/>
      <path d="M -7,8 C -7,3 7,3 7,8" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    </g>

    <!-- Node 5: (610, 280) -->
    <g transform="translate(610, 280)">
      <circle cx="0" cy="0" r="17" fill="#190a35" stroke="#34d399" stroke-width="2.5" filter="url(#glowEdu)"/>
      <circle cx="0" cy="-3" r="5" fill="#34d399"/>
      <path d="M -9,10 C -9,4 9,4 9,10" fill="none" stroke="#34d399" stroke-width="2"/>
    </g>
  </g>

  <!-- Glowing Graduation Cap & Academy Symbol (x=590, y=140) -->
  <g transform="translate(590, 140)" filter="url(#shadowEdu)">
    <circle cx="0" cy="0" r="40" fill="url(#capGlow)"/>
    <!-- Mortarboard Rhombus -->
    <polygon points="0,-16 28,-2 0,12 -28,-2" fill="#190a35" stroke="#fbbf24" stroke-width="2.5" filter="url(#glowEdu)"/>
    <!-- Skull Cap Underneath -->
    <path d="M -16,3 L -16,16 C -16,22 16,22 16,16 L 16,3" fill="#190a35" stroke="#fbbf24" stroke-width="2"/>
    <!-- Tassel -->
    <path d="M 0,-2 C 14,-2 24,6 26,16" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="26" cy="18" r="3" fill="#fbbf24"/>
  </g>

  <!-- Upward-Trending Admission Trajectory Curve (Bottom Canvas) -->
  <g>
    <!-- Shaded Admission Growth Area -->
    <path d="M 60,390 C 200,385 340,360 480,270 C 580,210 680,140 810,80 L 810,390 Z" fill="url(#eduArea)"/>
    <!-- Glowing Upward Path -->
    <path d="M 60,390 C 200,385 340,360 480,270 C 580,210 680,140 810,80" fill="none" stroke="url(#eduLine)" stroke-width="5" filter="url(#glowEdu)"/>
    <!-- Apex Admission Beacon at (810, 80) -->
    <circle cx="810" cy="80" r="14" fill="#10b981" opacity="0.3"/>
    <circle cx="810" cy="80" r="6" fill="#ffffff" filter="url(#glowEdu)"/>
  </g>

  <!-- Floating Telemetry Card 1: Admissions Scale (Top Left) -->
  <g transform="translate(60, 45)" filter="url(#shadowEdu)">
    <rect width="360" height="95" rx="18" fill="url(#eduCard)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.2"/>
    <text x="24" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">STUDENT ADMISSIONS ACCELERATED</text>
    <!-- Comparison -->
    <text x="24" y="68" fill="#94a3b8" font-size="22" font-weight="700">34</text>
    <path d="M 65,62 L 85,62 M 80,56 L 87,62 L 80,68" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="100" y="72" fill="#34d399" font-size="34" font-weight="800">128 Students</text>
    <!-- Badge -->
    <rect x="250" y="48" width="90" height="26" rx="13" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="1"/>
    <text x="295" y="65" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">+276%</text>
  </g>

  <!-- Floating Telemetry Card 2: Application Verified Card (Middle Left) -->
  <g transform="translate(60, 155)" filter="url(#shadowEdu)">
    <rect width="310" height="120" rx="16" fill="url(#eduCard)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.2"/>
    <!-- Metric 1: Inquiries -->
    <circle cx="28" cy="35" r="10" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1.2"/>
    <path d="M 23,35 L 27,39 L 34,31" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="32" fill="#ffffff" font-size="13" font-weight="700">High-Intent Inquiries</text>
    <text x="48" y="48" fill="#93c5fd" font-size="11.5" font-weight="600">1,420+ Verified Prospects</text>

    <!-- Divider Line -->
    <line x1="20" y1="62" x2="290" y2="62" stroke="rgba(255, 255, 255, 0.08)"/>

    <!-- Metric 2: CPA Reduction -->
    <circle cx="28" cy="90" r="10" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2"/>
    <path d="M 24,94 L 32,86 M 26,86 L 32,86 L 32,92" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="87" fill="#ffffff" font-size="13" font-weight="700">Cost Per Admission</text>
    <text x="48" y="103" fill="#34d399" font-size="11.5" font-weight="600">-58% Lower Acquisition Cost</text>
  </g>

  <!-- Floating Telemetry Card 3: Timeline Pill (Bottom Left) -->
  <g transform="translate(60, 290)" filter="url(#shadowEdu)">
    <rect width="250" height="42" rx="21" fill="url(#eduCard)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="6" fill="#3b82f6" filter="url(#glowEdu)"/>
    <text x="38" y="26" fill="#ffffff" font-size="12" font-weight="700">WITHIN 90 DAYS: <tspan fill="#38bdf8">SCALE ADMISSIONS</tspan></text>
  </g>

  <!-- Bottom Coordinates / Status Stamp -->
  <g transform="translate(60, 430)">
    <text x="0" y="0" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">ACADEMY GROWTH ENGINE • INTENT-TARGETED ENROLLMENT FUNNEL</text>
  </g>
</svg>