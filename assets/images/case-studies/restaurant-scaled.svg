<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 869 470" width="869" height="470" style="background:#090317; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="restBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2c0847" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#130424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070112" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="restGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="restCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a3c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d031b" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="growthArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowRest" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowRest" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="869" height="470" fill="url(#restBg)"/>

  <!-- Local Geo-Target Radar Circles (Centered at x=520, y=235) -->
  <g transform="translate(520, 235)">
    <circle cx="0" cy="0" r="220" fill="url(#targetGlow)"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="6,8"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00f0ff" stroke-opacity="0.8" stroke-width="2" filter="url(#glowRest)"/>

    <!-- Crosshair Target Vectors -->
    <line x1="-210" y1="0" x2="210" y2="0" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="0" y1="-210" x2="0" y2="210" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1"/>

    <!-- 5km Hyper-Local Radius Stamp -->
    <text x="100" y="-148" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1">RADIUS: 5.0 KM HYPER-LOCAL</text>
  </g>

  <!-- Food Outline Glyphs & Delivery Icons (Floating Neon Accents) -->
  <g opacity="0.75">
    <!-- Gourmet Burger Icon (x=450, y=140) -->
    <g transform="translate(450, 140)" filter="url(#glowRest)">
      <circle cx="0" cy="0" r="30" fill="url(#foodGlow)"/>
      <path d="M -18,-6 C -18,-18 18,-18 18,-6 Z" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <line x1="-19" y1="-2" x2="19" y2="-2" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-16" y1="4" x2="16" y2="4" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      <path d="M -17,9 C -17,14 17,14 17,9 Z" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    </g>

    <!-- Feast Plate & Cutlery (x=620, y=160) -->
    <g transform="translate(620, 160)" filter="url(#glowRest)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#00f0ff" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="3,3"/>
      <!-- Fork -->
      <line x1="-30" y1="-12" x2="-30" y2="12" stroke="#ffffff" stroke-width="2"/>
      <line x1="-33" y1="-12" x2="-27" y2="-12" stroke="#ffffff" stroke-width="2"/>
      <!-- Knife -->
      <line x1="30" y1="-12" x2="30" y2="12" stroke="#ffffff" stroke-width="2"/>
      <path d="M 30,-12 C 34,-12 34,-2 30,2" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Delivery Scooter & Pin (x=590, y=300) -->
    <g transform="translate(590, 300)" filter="url(#glowRest)">
      <!-- Scooter Base -->
      <circle cx="-14" cy="12" r="7" fill="none" stroke="#22d3ee" stroke-width="2.2"/>
      <circle cx="14" cy="12" r="7" fill="none" stroke="#22d3ee" stroke-width="2.2"/>
      <path d="M -14,12 L -6,12 L 0,0 L 10,0 L 14,12" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="0" y1="0" x2="-4" y2="-10" stroke="#00f0ff" stroke-width="2.2"/>
      <!-- Delivery Box -->
      <rect x="-14" y="-8" width="10" height="10" rx="2" fill="rgba(244, 63, 94, 0.4)" stroke="#f43f5e" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Scaled Revenue Growth Curve (Bottom Canvas) -->
  <g>
    <!-- Shaded Growth Trajectory -->
    <path d="M 60,390 C 200,380 340,360 460,290 C 560,230 680,180 810,120 L 810,390 Z" fill="url(#growthArea)"/>
    <!-- Glowing Growth Line -->
    <path d="M 60,390 C 200,380 340,360 460,290 C 560,230 680,180 810,120" fill="none" stroke="url(#cyanLine)" stroke-width="4.5" filter="url(#glowRest)"/>
    <!-- Target Surge Beacon at (810, 120) -->
    <circle cx="810" cy="120" r="14" fill="#00f0ff" opacity="0.3"/>
    <circle cx="810" cy="120" r="6" fill="#ffffff" filter="url(#glowRest)"/>
  </g>

  <!-- Floating Telemetry Card 1: Revenue Scale Metric (Top Left) -->
  <g transform="translate(60, 45)" filter="url(#shadowRest)">
    <rect width="360" height="95" rx="18" fill="url(#restCard)" stroke="rgba(0, 240, 255, 0.45)" stroke-width="1.2"/>
    <text x="24" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">MONTHLY RESTAURANT REVENUE</text>
    <!-- Before & After Comparison -->
    <text x="24" y="68" fill="#94a3b8" font-size="20" font-weight="700">₹3L</text>
    <path d="M 75,62 L 95,62 M 90,56 L 97,62 L 90,68" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="110" y="72" fill="#38bdf8" font-size="34" font-weight="800">₹10 Lakhs</text>
    <!-- Badge -->
    <rect x="255" y="48" width="85" height="26" rx="13" fill="rgba(74, 222, 128, 0.18)" stroke="#4ade80" stroke-width="1"/>
    <text x="297" y="65" fill="#4ade80" font-size="12" font-weight="800" text-anchor="middle">+233%</text>
  </g>

  <!-- Floating Telemetry Card 2: Dine-In & Delivery Channels (Bottom Left) -->
  <g transform="translate(60, 155)" filter="url(#shadowRest)">
    <rect width="320" height="120" rx="16" fill="url(#restCard)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2"/>
    <!-- Channel 1: Dine-in -->
    <circle cx="28" cy="35" r="10" fill="rgba(244, 63, 94, 0.25)" stroke="#f43f5e" stroke-width="1.2"/>
    <circle cx="28" cy="35" r="4" fill="#f43f5e"/>
    <text x="48" y="32" fill="#ffffff" font-size="13" font-weight="700">Dine-In Table Bookings</text>
    <text x="48" y="48" fill="#fda4af" font-size="11.5" font-weight="600">+180% Weekend Footfall</text>

    <!-- Divider Line -->
    <line x1="20" y1="62" x2="300" y2="62" stroke="rgba(255, 255, 255, 0.08)"/>

    <!-- Channel 2: Delivery Orders -->
    <circle cx="28" cy="90" r="10" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1.2"/>
    <circle cx="28" cy="90" r="4" fill="#00f0ff"/>
    <text x="48" y="87" fill="#ffffff" font-size="13" font-weight="700">Online Delivery Volume</text>
    <text x="48" y="103" fill="#38bdf8" font-size="11.5" font-weight="600">+290% Direct &amp; Aggregator Orders</text>
  </g>

  <!-- Floating Telemetry Card 3: Execution Timeline Badge (Bottom Left/Center) -->
  <g transform="translate(60, 290)" filter="url(#shadowRest)">
    <rect width="260" height="42" rx="21" fill="url(#restCard)" stroke="rgba(74, 222, 128, 0.4)" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="6" fill="#4ade80" filter="url(#glowRest)"/>
    <text x="38" y="26" fill="#ffffff" font-size="12" font-weight="700">WITHIN 100 DAYS: <tspan fill="#4ade80">PROFITABLE SCALE</tspan></text>
  </g>

  <!-- Bottom Coordinates / Status Stamp -->
  <g transform="translate(60, 430)">
    <text x="0" y="0" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">RESTAURANT GROWTH ENGINE • HYPER-LOCAL DEMAND CAPTURE PROTOCOL</text>
  </g>
</svg>