<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 869 470" width="869" height="470" style="background:#080214; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ecomBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#220645" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0f0322" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05010e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="ecomHalo" cx="55%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d946ef" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="roasLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="ecomCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c093a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c0218" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="roasArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowEcom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowEcom" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="869" height="470" fill="url(#ecomBg)"/>
  <circle cx="560" cy="220" r="260" fill="url(#ecomHalo)"/>

  <!-- Cyber E-Commerce Shopping Cart & Bag Graphics (Right Side) -->
  <g opacity="0.8">
    <!-- Glowing Shopping Cart (x=530, y=180) -->
    <g transform="translate(530, 180)" filter="url(#glowEcom)">
      <circle cx="0" cy="0" r="50" fill="url(#cartGlow)"/>
      <!-- Cart Wheels -->
      <circle cx="-16" cy="24" r="8" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
      <circle cx="16" cy="24" r="8" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
      <!-- Cart Body Basket -->
      <path d="M -32,-16 L -24,-16 L -14,14 L 24,14 L 32,-8 L -18,-8" fill="none" stroke="#d946ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-12" y1="-2" x2="28" y2="-2" stroke="#d946ef" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="6" x2="22" y2="6" stroke="#d946ef" stroke-width="2" stroke-linecap="round"/>
      <!-- Glowing Products inside Cart -->
      <rect x="-6" y="-14" width="12" height="12" rx="3" fill="#38bdf8" opacity="0.9"/>
      <rect x="8" y="-18" width="14" height="14" rx="3" fill="#fbbf24" opacity="0.9"/>
    </g>

    <!-- Glowing 3D Shopping Bag (x=680, y=140) -->
    <g transform="translate(680, 140)" filter="url(#glowEcom)">
      <!-- Bag Body -->
      <path d="M -22,-8 L 22,-8 L 28,32 L -28,32 Z" fill="rgba(34, 211, 238, 0.15)" stroke="#00f0ff" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Bag Handle -->
      <path d="M -12,-8 C -12,-24 12,-24 12,-8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Shopping Sparkle Tag -->
      <circle cx="0" cy="12" r="6" fill="#f43f5e"/>
    </g>

    <!-- Multi-Platform Ad Sync Pills (Right Background) -->
    <!-- Meta Ad Sync -->
    <g transform="translate(650, 230)" filter="url(#shadowEcom)">
      <rect width="165" height="36" rx="10" fill="url(#ecomCard)" stroke="rgba(217, 70, 239, 0.4)" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="6" fill="#d946ef" filter="url(#glowEcom)"/>
      <text x="34" y="22" fill="#ffffff" font-size="11" font-weight="700">Meta ROAS: <tspan fill="#f472b6">7.8x</tspan></text>
    </g>
    <!-- Google Shopping Sync -->
    <g transform="translate(650, 280)" filter="url(#shadowEcom)">
      <rect width="165" height="36" rx="10" fill="url(#ecomCard)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="6" fill="#00f0ff" filter="url(#glowEcom)"/>
      <text x="34" y="22" fill="#ffffff" font-size="11" font-weight="700">Google Ads: <tspan fill="#38bdf8">9.4x</tspan></text>
    </g>
  </g>

  <!-- Scaled ROAS Growth Curve (Bottom Canvas) -->
  <g>
    <!-- Shaded ROAS Area -->
    <path d="M 60,390 C 200,380 340,360 480,280 C 580,210 680,140 810,80 L 810,390 Z" fill="url(#roasArea)"/>
    <!-- Glowing Upward Trajectory -->
    <path d="M 60,390 C 200,380 340,360 480,280 C 580,210 680,140 810,80" fill="none" stroke="url(#roasLine)" stroke-width="5" filter="url(#glowEcom)"/>
    <!-- Apex ROAS Star at (810, 80) -->
    <circle cx="810" cy="80" r="14" fill="#00f0ff" opacity="0.3"/>
    <circle cx="810" cy="80" r="6" fill="#ffffff" filter="url(#glowEcom)"/>
  </g>

  <!-- Floating Telemetry Card 1: ROAS Scale (Top Left) -->
  <g transform="translate(60, 45)" filter="url(#shadowEcom)">
    <rect width="360" height="95" rx="18" fill="url(#ecomCard)" stroke="rgba(217, 70, 239, 0.45)" stroke-width="1.2"/>
    <text x="24" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">ECOMMERCE BLENDED ROAS SCALED</text>
    <!-- Comparison -->
    <text x="24" y="68" fill="#94a3b8" font-size="22" font-weight="700">2.3x</text>
    <path d="M 75,62 L 95,62 M 90,56 L 97,62 L 90,68" fill="none" stroke="#d946ef" stroke-width="2.5" stroke-linecap="round"/>
    <text x="110" y="72" fill="#38bdf8" font-size="34" font-weight="800">8.6x ROAS</text>
    <!-- Badge -->
    <rect x="250" y="48" width="90" height="26" rx="13" fill="rgba(74, 222, 128, 0.18)" stroke="#4ade80" stroke-width="1"/>
    <text x="295" y="65" fill="#4ade80" font-size="12" font-weight="800" text-anchor="middle">3.7x BOOST</text>
  </g>

  <!-- Floating Telemetry Card 2: Checkout Conversion Metrics (Middle Left) -->
  <g transform="translate(60, 155)" filter="url(#shadowEcom)">
    <rect width="310" height="120" rx="16" fill="url(#ecomCard)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.2"/>
    <!-- Metric 1: AOV Increase -->
    <circle cx="28" cy="35" r="10" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="28" y="39" fill="#00f0ff" font-size="11" font-weight="800" text-anchor="middle">₹</text>
    <text x="48" y="32" fill="#ffffff" font-size="13" font-weight="700">Average Order Value (AOV)</text>
    <text x="48" y="48" fill="#38bdf8" font-size="11.5" font-weight="600">+46% Cart Size Expansion</text>

    <!-- Divider Line -->
    <line x1="20" y1="62" x2="290" y2="62" stroke="rgba(255, 255, 255, 0.08)"/>

    <!-- Metric 2: Checkout CRO -->
    <circle cx="28" cy="90" r="10" fill="rgba(217, 70, 239, 0.2)" stroke="#d946ef" stroke-width="1.2"/>
    <path d="M 23,90 L 27,94 L 34,86" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="87" fill="#ffffff" font-size="13" font-weight="700">Checkout Conversion Rate</text>
    <text x="48" y="103" fill="#f472b6" font-size="11.5" font-weight="600">4.82% High-Ticket Purchase Rate</text>
  </g>

  <!-- Floating Telemetry Card 3: Timeline Pill (Bottom Left) -->
  <g transform="translate(60, 290)" filter="url(#shadowEcom)">
    <rect width="250" height="42" rx="21" fill="url(#ecomCard)" stroke="rgba(217, 70, 239, 0.4)" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="6" fill="#d946ef" filter="url(#glowEcom)"/>
    <text x="38" y="26" fill="#ffffff" font-size="12" font-weight="700">WITHIN 100 DAYS: <tspan fill="#f472b6">8.6x ROAS PEAK</tspan></text>
  </g>

  <!-- Bottom Coordinates / Status Stamp -->
  <g transform="translate(60, 430)">
    <text x="0" y="0" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">ECOMMERCE PERFORMANCE SUITE • META &amp; GOOGLE ATTRIBUTION MATRIX</text>
  </g>
</svg>