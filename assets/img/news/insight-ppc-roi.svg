<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 869 470" width="869" height="470" style="background:#09031a; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowPPC" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#220743" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#100324" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05010e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="centerBurst" cx="55%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Curve & Area Gradients -->
    <linearGradient id="seoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="seoArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="ppcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ppcArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="barGradCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="barGradPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#701a75" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="cardGradPPC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b3c" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0c031a" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowPPC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowPPC" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="869" height="470" fill="url(#bgGlowPPC)"/>
  <circle cx="480" cy="240" r="260" fill="url(#centerBurst)"/>

  <!-- Analytics Grid Lines -->
  <g opacity="0.35">
    <!-- Horizontal Grid Levels -->
    <line x1="60" y1="380" x2="810" y2="380" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="45" y="384" fill="#64748b" font-size="10" font-weight="600" text-anchor="end">$0</text>

    <line x1="60" y1="310" x2="810" y2="310" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,6"/>
    <text x="45" y="314" fill="#64748b" font-size="10" font-weight="600" text-anchor="end">$50K</text>

    <line x1="60" y1="240" x2="810" y2="240" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,6"/>
    <text x="45" y="244" fill="#64748b" font-size="10" font-weight="600" text-anchor="end">$150K</text>

    <line x1="60" y1="170" x2="810" y2="170" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,6"/>
    <text x="45" y="174" fill="#64748b" font-size="10" font-weight="600" text-anchor="end">$350K</text>

    <line x1="60" y1="100" x2="810" y2="100" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,6"/>
    <text x="45" y="104" fill="#64748b" font-size="10" font-weight="600" text-anchor="end">$750K+</text>

    <!-- Vertical Timeline Markers -->
    <line x1="210" y1="100" x2="210" y2="380" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,8"/>
    <text x="210" y="398" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Month 1</text>

    <line x1="360" y1="100" x2="360" y2="380" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,8"/>
    <text x="360" y="398" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Month 3</text>

    <line x1="510" y1="100" x2="510" y2="380" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="4,6"/>
    <text x="510" y="398" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Month 6 (Synergy)</text>

    <line x1="660" y1="100" x2="660" y2="380" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,8"/>
    <text x="660" y="398" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Month 12</text>
  </g>

  <!-- Financial Candlestick / Bar Columns -->
  <g opacity="0.6">
    <rect x="195" y="340" width="12" height="40" rx="3" fill="url(#barGradPurple)"/>
    <rect x="215" y="360" width="12" height="20" rx="3" fill="url(#barGradCyan)"/>

    <rect x="345" y="270" width="12" height="110" rx="3" fill="url(#barGradPurple)"/>
    <rect x="365" y="315" width="12" height="65" rx="3" fill="url(#barGradCyan)"/>

    <rect x="495" y="225" width="12" height="155" rx="3" fill="url(#barGradPurple)"/>
    <rect x="515" y="235" width="12" height="145" rx="3" fill="url(#barGradCyan)"/>

    <rect x="645" y="195" width="12" height="185" rx="3" fill="url(#barGradPurple)"/>
    <rect x="665" y="130" width="12" height="250" rx="3" fill="url(#barGradCyan)"/>
  </g>

  <!-- Area Fill Under Curves -->
  <g>
    <!-- Paid PPC Area -->
    <path d="M 80,380 C 130,290 240,250 360,240 C 480,230 600,210 780,185 L 780,380 Z" fill="url(#ppcArea)"/>
    <!-- Organic SEO Area -->
    <path d="M 80,378 C 220,370 360,335 480,265 C 600,195 700,130 780,85 L 780,380 Z" fill="url(#seoArea)"/>
  </g>

  <!-- Trajectory Curve 1: Paid Google Ads PPC (Magenta Line) -->
  <path d="M 80,380 C 130,290 240,250 360,240 C 480,230 600,210 780,185" fill="none" stroke="url(#ppcGrad)" stroke-width="4" filter="url(#glowPPC)"/>

  <!-- Trajectory Curve 2: Compounding Organic SEO (Cyan Line) -->
  <path d="M 80,378 C 220,370 360,335 480,265 C 600,195 700,130 780,85" fill="none" stroke="url(#seoGrad)" stroke-width="4.5" filter="url(#glowPPC)"/>

  <!-- Key Synergy Intersection Point (x=505, y=252) -->
  <g transform="translate(505, 252)" filter="url(#shadowPPC)">
    <!-- Radar Pulse -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#d946ef" stroke-width="2" opacity="0.8" filter="url(#glowPPC)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" filter="url(#glowPPC)"/>
    <!-- Floating Crossover Tag -->
    <rect x="-85" y="-55" width="170" height="34" rx="10" fill="url(#cardGradPPC)" stroke="rgba(34, 211, 238, 0.6)" stroke-width="1.2"/>
    <text x="0" y="-33" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">⚡ HYBRID CROSSOVER</text>
  </g>

  <!-- End of Curve 2: Compounding SEO Star Indicator (x=780, y=85) -->
  <g transform="translate(780, 85)" filter="url(#glowPPC)">
    <circle cx="0" cy="0" r="12" fill="#22d3ee" opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Floating Telemetry Card 1: Top Strategy Pill (Top Left) -->
  <g transform="translate(60, 42)" filter="url(#shadowPPC)">
    <rect width="330" height="42" rx="21" fill="url(#cardGradPPC)" stroke="rgba(217, 70, 239, 0.4)" stroke-width="1.2"/>
    <!-- Paid Ads Icon -->
    <rect x="8" y="7" width="28" height="28" rx="14" fill="rgba(217, 70, 239, 0.25)"/>
    <text x="22" y="25" fill="#f472b6" font-size="12" font-weight="700" text-anchor="middle">PPC</text>
    <text x="46" y="26" fill="#ffffff" font-size="12.5" font-weight="600">PAID SPEED <tspan fill="#94a3b8">vs</tspan> ORGANIC COMPOUNDING</text>
  </g>

  <!-- Floating Telemetry Card 2: Peak ROAS Box (Top Right) -->
  <g transform="translate(545, 42)" filter="url(#shadowPPC)">
    <rect width="265" height="74" rx="16" fill="url(#cardGradPPC)" stroke="rgba(34, 211, 238, 0.45)" stroke-width="1.2"/>
    <text x="20" y="26" fill="#94a3b8" font-size="10.5" font-weight="700" letter-spacing="0.8">MAX HYBRID RETURN</text>
    <text x="20" y="58" fill="#38bdf8" font-size="28" font-weight="800" letter-spacing="-0.5">4.8x – 8.6x</text>
    <text x="175" y="47" fill="#ffffff" font-size="13" font-weight="700">ROAS</text>
    <text x="175" y="63" fill="#34d399" font-size="11" font-weight="600">-42% Blended CAC</text>
  </g>

  <!-- Bottom Legend / Strategy Comparison Row -->
  <g transform="translate(60, 426)">
    <!-- Legend Item 1: SEO -->
    <circle cx="8" cy="-5" r="5" fill="#22d3ee" filter="url(#glowPPC)"/>
    <text x="20" y="-1" fill="#e2e8f0" font-size="11.5" font-weight="600">Organic SEO: Zero Marginal Click Cost &amp; Infinite Longevity</text>

    <!-- Legend Item 2: PPC -->
    <circle cx="460" cy="-5" r="5" fill="#d946ef" filter="url(#glowPPC)"/>
    <text x="472" y="-1" fill="#e2e8f0" font-size="11.5" font-weight="600">Paid Google Ads: Instant High-Intent Conversion Scalability</text>
  </g>
</svg>