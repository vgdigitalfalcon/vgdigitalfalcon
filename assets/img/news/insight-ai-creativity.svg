<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 869 470" width="869" height="470" style="background:#070114; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowAI" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#240747" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#110326" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050010" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="neuralAura" cx="35%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="creativeAura" cx="65%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="aiSynapse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="humanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a3d" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0c021a" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowAI" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowAI" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="869" height="470" fill="url(#bgGlowAI)"/>
  <circle cx="300" cy="235" r="280" fill="url(#neuralAura)"/>
  <circle cx="580" cy="235" r="280" fill="url(#creativeAura)"/>

  <!-- Background Quantum Grid Mesh -->
  <g opacity="0.2">
    <circle cx="434" cy="235" r="80" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,6"/>
    <circle cx="434" cy="235" r="150" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="6,8"/>
    <circle cx="434" cy="235" r="230" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="8,10"/>
    <line x1="100" y1="235" x2="769" y2="235" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,8"/>
    <line x1="434" y1="50" x2="434" y2="420" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,8"/>
  </g>

  <!-- Left Side: Neural AI Lattice (Nodes & Mathematical Synapses) -->
  <g>
    <!-- Synaptic Lines -->
    <path d="M 160,150 L 250,190 L 330,140 L 434,235" fill="none" stroke="url(#aiSynapse)" stroke-width="2" opacity="0.65" filter="url(#glowAI)"/>
    <path d="M 140,260 L 220,280 L 320,250 L 434,235" fill="none" stroke="url(#aiSynapse)" stroke-width="2.5" opacity="0.8" filter="url(#glowAI)"/>
    <path d="M 180,360 L 260,330 L 350,310 L 434,235" fill="none" stroke="url(#aiSynapse)" stroke-width="2" opacity="0.65" filter="url(#glowAI)"/>
    <path d="M 250,190 L 220,280 L 260,330" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.4" stroke-dasharray="4,4"/>
    <path d="M 330,140 L 320,250 L 350,310" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>

    <!-- Neural Nodes -->
    <circle cx="160" cy="150" r="7" fill="#06b6d4" filter="url(#glowAI)"/>
    <circle cx="160" cy="150" r="3" fill="#ffffff"/>

    <circle cx="250" cy="190" r="9" fill="#22d3ee" filter="url(#glowAI)"/>
    <circle cx="250" cy="190" r="4" fill="#ffffff"/>

    <circle cx="330" cy="140" r="11" fill="#8b5cf6" filter="url(#glowAI)"/>
    <circle cx="330" cy="140" r="5" fill="#ffffff"/>

    <circle cx="140" cy="260" r="8" fill="#06b6d4" filter="url(#glowAI)"/>
    <circle cx="140" cy="260" r="3" fill="#ffffff"/>

    <circle cx="220" cy="280" r="12" fill="#38bdf8" filter="url(#glowAI)"/>
    <circle cx="220" cy="280" r="5" fill="#ffffff"/>

    <circle cx="320" cy="250" r="14" fill="#a855f7" filter="url(#glowAI)"/>
    <circle cx="320" cy="250" r="6" fill="#ffffff"/>

    <circle cx="180" cy="360" r="7" fill="#06b6d4" filter="url(#glowAI)"/>
    <circle cx="180" cy="360" r="3" fill="#ffffff"/>

    <circle cx="260" cy="330" r="10" fill="#22d3ee" filter="url(#glowAI)"/>
    <circle cx="260" cy="330" r="4" fill="#ffffff"/>

    <circle cx="350" cy="310" r="11" fill="#8b5cf6" filter="url(#glowAI)"/>
    <circle cx="350" cy="310" r="5" fill="#ffffff"/>
  </g>

  <!-- Right Side: Flowing Creative Waves & Storytelling Energy -->
  <g>
    <!-- Dynamic Bezier Storytelling Ribbons -->
    <path d="M 434,235 C 510,160 580,120 680,130 C 740,136 780,170 820,160" fill="none" stroke="url(#humanRibbon)" stroke-width="4.5" opacity="0.85" filter="url(#glowAI)"/>
    <path d="M 434,235 C 520,200 600,210 690,200 C 760,192 800,240 850,230" fill="none" stroke="url(#humanRibbon)" stroke-width="5" opacity="0.9" filter="url(#glowAI)"/>
    <path d="M 434,235 C 500,280 570,330 660,340 C 740,350 790,320 840,350" fill="none" stroke="url(#humanRibbon)" stroke-width="4" opacity="0.8" filter="url(#glowAI)"/>

    <!-- Harmonizing Flow Waves -->
    <path d="M 434,235 C 540,130 640,290 750,220 C 790,195 830,220 869,210" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5" stroke-dasharray="6,4"/>
    <path d="M 434,235 C 520,320 620,160 730,280 C 780,330 820,280 869,300" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.5" stroke-dasharray="8,6"/>

    <!-- Creative Spark Star Clusters -->
    <g transform="translate(680, 130)">
      <circle cx="0" cy="0" r="8" fill="#f59e0b" filter="url(#glowAI)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
    <g transform="translate(690, 200)">
      <circle cx="0" cy="0" r="10" fill="#ec4899" filter="url(#glowAI)"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>
    <g transform="translate(660, 340)">
      <circle cx="0" cy="0" r="9" fill="#f43f5e" filter="url(#glowAI)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- Central Quantum Fusion Nexus (x=434, y=235) -->
  <g transform="translate(434, 235)" filter="url(#shadowAI)">
    <!-- Radiant Core -->
    <circle cx="0" cy="0" r="70" fill="url(#coreGlow)"/>

    <!-- Outer Concentric Energy Rings -->
    <ellipse cx="0" cy="0" rx="44" ry="44" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" filter="url(#glowAI)"/>
    <ellipse cx="0" cy="0" rx="54" ry="24" fill="none" stroke="#22d3ee" stroke-width="1.8" opacity="0.7" transform="rotate(35)"/>
    <ellipse cx="0" cy="0" rx="54" ry="24" fill="none" stroke="#ec4899" stroke-width="1.8" opacity="0.7" transform="rotate(-35)"/>

    <!-- Central Brain + Quill Hologram Symbol -->
    <circle cx="0" cy="0" r="26" fill="#0d0322" stroke="url(#humanRibbon)" stroke-width="2"/>
    <!-- Stylized AI Spark / Brand Quill -->
    <path d="M 0,-14 L 4,-4 L 14,0 L 4,4 L 0,14 L -4,4 L -14,0 L -4,-4 Z" fill="#ffffff" filter="url(#glowAI)"/>
  </g>

  <!-- Floating Telemetry Card 1: Header Strategy Pill (Top Center) -->
  <g transform="translate(234, 40)" filter="url(#shadowAI)">
    <rect width="400" height="42" rx="21" fill="url(#cardGradAI)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.2"/>
    <!-- Glowing Dot -->
    <circle cx="22" cy="21" r="6" fill="#22d3ee" filter="url(#glowAI)"/>
    <text x="38" y="26" fill="#ffffff" font-size="12.5" font-weight="700">THE WINNING FORMULA: <tspan fill="#38bdf8">AI PRECISION</tspan> + <tspan fill="#ec4899">HUMAN SOUL</tspan></text>
  </g>

  <!-- Floating Telemetry Card 2: Neural Intelligence (Left Bottom) -->
  <g transform="translate(60, 360)" filter="url(#shadowAI)">
    <rect width="260" height="64" rx="14" fill="url(#cardGradAI)" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.2"/>
    <text x="18" y="26" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.6">AI COGNITIVE SCALE</text>
    <text x="18" y="47" fill="#ffffff" font-size="13" font-weight="700">10x Production Speed</text>
  </g>

  <!-- Floating Telemetry Card 3: Human Resonance (Right Bottom) -->
  <g transform="translate(549, 360)" filter="url(#shadowAI)">
    <rect width="260" height="64" rx="14" fill="url(#cardGradAI)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2"/>
    <text x="18" y="26" fill="#f472b6" font-size="11" font-weight="700" letter-spacing="0.6">EMOTIONAL RESONANCE</text>
    <text x="18" y="47" fill="#ffffff" font-size="13" font-weight="700">99.4% Storytelling Recall</text>
  </g>
</svg>