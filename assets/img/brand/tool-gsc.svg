    <!-- Analytics Chart Bars -->
    <rect x="9" y="20" width="3.5" height="9" rx="1.5" fill="#4285F4"/>
    <rect x="14.5" y="14" width="3.5" height="15" rx="1.5" fill="#EA4335"/>
    <rect x="20" y="10" width="3.5" height="19" rx="1.5" fill="#FBBC04"/>
    <rect x="25.5" y="17" width="3.5" height="12" rx="1.5" fill="#34A853"/>
