    <circle cx="24" cy="11" r="3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <path d="M26.2 13.2L28.5 15.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
